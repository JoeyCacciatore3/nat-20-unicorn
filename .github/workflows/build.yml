name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y advancecomp zip
      - run: npm ci
      - run: npm run build   # fails if zip > 13,312 bytes or rules-compliance grep trips
      - uses: actions/upload-artifact@v4
        with:
          name: game-zip
          path: dist/game.zip
